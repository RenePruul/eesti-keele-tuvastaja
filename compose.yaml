services:
  keele-api:
    image: eesti-keele-api:latest
    build: .
    ports:
      - "127.0.0.1:${KEELETUVASTAJA_PORT:-8000}:${KEELETUVASTAJA_PORT:-8000}"
    environment:
      KEELETUVASTAJA_PORT: "${KEELETUVASTAJA_PORT:-8000}"
      KEELETUVASTAJA_MAX_TEXT_LENGTH: "${KEELETUVASTAJA_MAX_TEXT_LENGTH:-10000}"
      KEELETUVASTAJA_MAX_REQUEST_BYTES: "${KEELETUVASTAJA_MAX_REQUEST_BYTES:-65536}"
      KEELETUVASTAJA_REQUEST_TIMEOUT_SECONDS: "${KEELETUVASTAJA_REQUEST_TIMEOUT_SECONDS:-2.5}"
    restart: unless-stopped
